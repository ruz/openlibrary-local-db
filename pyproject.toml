[tool.poetry]
name = "openlibrary-local-db"
version = "1.0.0"
description = ""
authors = ["Andreas Backström <mozzo242@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "api"}]

[tool.poetry.dependencies]
python = "^3.12"
Flask = "^3.0.3"
Flask-Cors = "^4.0.1"
python-dotenv = "^1.0.1"
gunicorn = "^22.0.0"
flasgger = "^0.9.7.1"
sqlite-utils = "^3.36"
requests = "^2.34.2"
libtorrent = "^2.0.13"
tqdm = "^4.68.4"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[tool.poetry.scripts]
pipeline = "pipeline:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
